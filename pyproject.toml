[project]
name = "ym-handcalcs"
dynamic = ["version", "description"]
readme = "README.md"
authors = [
    { name = "Connor Ferster", email = "connor@structuralpython.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.14"
dependencies = [
    "handcalcs>=2.0.0rc2",
    "reportlab>=4.5.1",
]

[project.urls]
Homepage = "https://github.com/StructuralPython/ym-handcalcs"

[build-system]
requires = ["flit_core>=3.12,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "ym_handcalcs"

[dependency-groups]
dev = [
    "numpy>=2.3.0",
    "pytest>=9.0.3",
    "ymprint>=0.6.0",
]
